<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI Era Technology Radar</title>
  <desc id="desc">Editorial artwork for DesignIt.pro showing an AI-era technology radar with policy, security, infrastructure, and product signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071014"/>
      <stop offset="0.48" stop-color="#102026"/>
      <stop offset="1" stop-color="#041316"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#69f0ae"/>
      <stop offset="1" stop-color="#73d5ff"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#8de7ff" stroke-width="1">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M120 0v630M240 0v630M360 0v630M480 0v630M600 0v630M720 0v630M840 0v630M960 0v630M1080 0v630"/>
  </g>
  <circle cx="856" cy="302" r="212" fill="none" stroke="#2f8290" stroke-width="2"/>
  <circle cx="856" cy="302" r="146" fill="none" stroke="#2f8290" stroke-width="2" opacity="0.72"/>
  <circle cx="856" cy="302" r="78" fill="none" stroke="#2f8290" stroke-width="2" opacity="0.72"/>
  <path d="M856 302 1038 205" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="856" cy="302" r="9" fill="#69f0ae"/>
  <g fill="#73d5ff">
    <circle cx="952" cy="186" r="7"/>
    <circle cx="737" cy="256" r="6"/>
    <circle cx="986" cy="398" r="8"/>
    <circle cx="792" cy="439" r="5"/>
    <circle cx="1043" cy="290" r="5"/>
  </g>
  <g filter="url(#soft)" opacity="0.45">
    <circle cx="970" cy="200" r="48" fill="#69f0ae"/>
    <circle cx="770" cy="430" r="36" fill="#73d5ff"/>
  </g>
  <text x="84" y="132" fill="#69f0ae" font-family="Space Mono, monospace" font-size="25">DESIGNIT.PRO / AI ERA RADAR</text>
  <text x="84" y="226" fill="#f4fbff" font-family="Sora, Arial, sans-serif" font-size="66" font-weight="700">AI-era technology</text>
  <text x="84" y="304" fill="#f4fbff" font-family="Sora, Arial, sans-serif" font-size="66" font-weight="700">signals for builders</text>
  <text x="88" y="366" fill="#b9cfd4" font-family="Manrope, Arial, sans-serif" font-size="28">Policy, security, infrastructure, product risk, and</text>
  <text x="88" y="405" fill="#b9cfd4" font-family="Manrope, Arial, sans-serif" font-size="28">the evidence teams need before the next release.</text>
  <g font-family="Space Mono, monospace" font-size="20" fill="#071014">
