    <rect x="258" y="470" width="148" height="38" rx="4" fill="#73d5ff"/>
    <text x="276" y="496">SECURITY</text>
    <rect x="426" y="470" width="164" height="38" rx="4" fill="#f7d774"/>
    <text x="444" y="496">INCIDENTS</text>
