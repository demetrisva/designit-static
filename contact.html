<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect // DesignIt.pro</title>
    <meta name="description" content="Initialize transmission. Contact DesignIt.pro.">

    <!-- Space Mono Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css?v=3.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6942670124765473"
        crossorigin="anonymous"></script>
</head>

<body>

    <div class="grid-background"></div>

    <header>
        <nav class="container nav-layout">
            <a href="index.html" class="logo">{ DesignIt.pro }</a>
            <a href="index.html" class="secondary-button" style="padding: 0.5rem 1rem; font-size: 0.8rem;">&lt;
                ABORT</a>
        </nav>
    </header>

    <main style="padding-top: 200px; padding-bottom: 8rem; min-height: 80vh; display: flex; align-items: center;">
        <div class="container contact-container" style="max-width: 600px;">
            <h1 style="margin-bottom: 1rem;">ESTABLISH_UPLINK</h1>
            <p style="margin-bottom: 3rem;">Secure channel open. Input parameters below.</p>

            <form id="contact-form" action="https://formspree.io/f/meovjkay" method="POST">
                <div class="form-group">
                    <label for="name">IDENTITY_</label>
                    <input type="text" id="name" name="name" required placeholder="Name / Organization">
                </div>
                <div class="form-group">
                    <label for="email">RETURN_ADDRESS_</label>
                    <input type="email" id="email" name="email" required placeholder="Email Address">
                </div>
                <div class="form-group">
                    <label for="message">DATA_PACKET_</label>
                    <textarea id="message" name="message" rows="6" required
                        placeholder="Transmission content..."></textarea>
                </div>
                <button type="submit" class="cta-button full-width">TRANSMIT REQUEST_</button>
            </form>
        </div>
    </main>

    <footer
        style="position: fixed; bottom: 0; width: 100%; padding: 1rem 0; background: var(--bg-color); border-top: 1px solid var(--border-light);">
        <div class="container footer-content">
            <p>&copy; 2026 DesignIt.pro // SYSTEM_ACTIVE</p>
        </div>
    </footer>

</body>

</html>
